name: Build and Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/hectororviz/tinogames-web
  IMAGE_API: ghcr.io/hectororviz/tinogames-api
  VITE_API_URL: https://api.juegos.mposw.com.ar

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinogames/level-schema build
      - run: pnpm test
      - run: pnpm typecheck

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          TAGS_WEB="${{ env.IMAGE_WEB }}:latest,${{ env.IMAGE_WEB }}:${GITHUB_SHA::7}"
          TAGS_API="${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${GITHUB_SHA::7}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS_WEB="${TAGS_WEB},${{ env.IMAGE_WEB }}:${VERSION}"
            TAGS_API="${TAGS_API},${{ env.IMAGE_API }}:${VERSION}"
          fi
          echo "tags_web=${TAGS_WEB}" >> $GITHUB_OUTPUT
          echo "tags_api=${TAGS_API}" >> $GITHUB_OUTPUT

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags_web }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags_api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
