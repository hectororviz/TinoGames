<!doctype html>

    <style>

      #home-logo { color: #fff; font-size: clamp(30px, 5vw, 46px); font-weight: 900;

      #home-center { display: flex; gap: clamp(12px, 4vw, 36px); align-items: center; justify-content: center;

      #home-center { display: flex; gap: clamp(12px, 4vw, 36px); align-items: center; justify-content: center; }
      #home .hbtn { display: flex; flex-direction: column; align-items: center; justify-content: center;

      #home .hbtn:hover { background: #2e2e4d; border-color: #4a9eff; }

  <body>
    <div id="stage">
      <div id="home">

        <div id="home-center">
          <button type="button" id="home-profile" class="hbtn med">
            <span class="ico">👤</span><span class="lbl">Perfil</span>

          <button type="button" id="home-search" class="hbtn big">

          <button type="button" id="home-create" class="hbtn med">
            <span class="ico">🛠</span><span class="lbl">Crear nivel</span>

          style="display: block"
          data-ad-client="ca-pub-9763480712544528"
          data-ad-slot="8831048337"
          data-ad-format="auto"
          data-full-width-responsive="true"
        ></ins>

    <nav id="editor-ui" aria-label="Editor de niveles">

      <div id="ed-topbar">

          </div>
        </div>
      </div>
      <div id="ed-rail">

        <button type="button" data-edcat="personaje"><span class="ico">🦸</span><span class="nm">Personaje</span><span class="ar">▸</span></button>
        <button type="button" data-edcat="enemigos"><span class="ico">👾</span><span class="nm">Enemigos</span><span class="ar">▸</span></button>
        <button type="button" data-edcat="frutas"><span class="ico">🍎</span><span class="nm">Fruta</span><span class="ar">▸</span></button>
        <button type="button" data-edcat="gemas"><span class="ico">💎</span><span class="nm">Gema</span><span class="ar">▸</span></button>
        <button type="button" data-edcat="obstaculos"><span class="ico">⚠️</span><span class="nm">Obstáculo</span><span class="ar">▸</span></button>
        <button type="button" data-edcat="otros"><span class="ico">📦</span><span class="nm">Otros</span><span class="ar">▸</span></button>
