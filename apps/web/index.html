<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#87b5e8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TinoGames</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9763480712544528" crossorigin="anonymous"></script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #87b5e8; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; align-items: center; }
      #stage { width: min(960px, 100vw); display: flex; flex-direction: column; align-items: stretch; }
      #game-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
      #app { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      #touch { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 12px; pointer-events: none; }
      body.playing #touch { display: flex; }
      #touch .grp { display: flex; gap: 12px; }
      #touch button { pointer-events: auto; width: 64px; height: 64px; font-size: 24px; border-radius: 50%; border: none; opacity: 0.65; touch-action: none; }
      #ad-slot { width: 100%; min-height: 100px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 4px;
        background: #6f97c8; color: #e8f1fb; font-family: system-ui, sans-serif; font-size: 12px; }
      #ad-slot:empty { display: none; }
      @media (max-width: 600px) { #ad-slot { min-height: 60px; } }
      #editor-ui { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        background: #1a1a2e; color: #fff; font-family: system-ui, sans-serif;
        font-size: 14px; padding: 6px 8px; user-select: none; }
      body.editing #editor-ui { display: block; }
      body.editing #touch { display: none; }
      #editor-ui .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #editor-ui .row + .row { margin-top: 6px; }
      #editor-ui button { font-size: 14px; line-height: 1; color: #fff; background: #33334d;
        border: 1px solid #55557a; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
      #editor-ui button:hover { background: #44446a; }
      #editor-ui button.active { background: #4a9eff; border-color: #4a9eff; }
      #editor-ui #ed-status { margin-left: 8px; font-size: 13px; }
      #editor-ui #ed-status.ok { color: #44ff44; }
      #editor-ui #ed-status.err { color: #ff6666; }
      #game-back { display: none; position: fixed; top: 10px; right: 10px; z-index: 10;
        font-size: 14px; font-family: system-ui, sans-serif; color: #fff; background: #33334d;
        border: 1px solid #55557a; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
      body.playing #game-back { display: block; }
      #menu-ui { display: none; position: fixed; left: 0; right: 0; top: 118px; z-index: 10;
        font-family: system-ui, sans-serif; color: #fff; font-size: 14px;
        flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; }
      body.menu #menu-ui { display: flex; }
      #menu-ui #menu-list { display: flex; flex-direction: column; gap: 8px; width: min(420px, 92vw); }
      #menu-ui .menu-row { display: flex; gap: 6px; align-items: center; background: #23233d;
        border: 1px solid #44446a; border-radius: 8px; padding: 8px 10px; }
      #menu-ui .menu-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #menu-ui .menu-row .bad { color: #ff8888; font-size: 12px; }
      #menu-ui button { font-size: 14px; color: #fff; background: #33334d;
        border: 1px solid #55557a; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
      #menu-ui button:hover { background: #44446a; }
      #menu-ui button.primary { background: #4a9eff; border-color: #4a9eff; }
      #menu-ui #menu-empty { color: #aaaacc; }
      #editor-ui input[type="text"] { font-size: 14px; color: #fff; background: #23233d;
        border: 1px solid #55557a; border-radius: 6px; padding: 6px 8px; min-width: 140px; }
      #editor-ui select { font-size: 14px; color: #fff; background: #23233d;
        border: 1px solid #55557a; border-radius: 6px; padding: 6px 8px; max-width: 180px; }
      #ed-tile-btn { width: 36px; height: 36px; padding: 0; image-rendering: pixelated;
        background-repeat: no-repeat; }
      #ed-tile-grid { position: fixed; z-index: 20; max-width: min(560px, 94vw); max-height: 50vh;
        overflow: auto; background: #23233d; border: 1px solid #55557a; border-radius: 8px;
        padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, 32px); gap: 4px; }
      #ed-tile-grid[hidden] { display: none; }
      #ed-tile-grid button { width: 32px; height: 32px; padding: 0; image-rendering: pixelated;
        background-repeat: no-repeat; background-color: #1a1a2e;
        border: 1px solid #44446a; border-radius: 4px; cursor: pointer; }
      #ed-tile-grid button.sel { border-color: #4a9eff; outline: 2px solid #4a9eff; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game-frame">
        <div id="app"></div>
        <div id="touch">
          <div class="grp">
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
          </div>
          <div class="grp">
            <button id="btn-jump">A</button>
            <button id="btn-dash">B</button>
          </div>
        </div>
      </div>
      <div id="ad-slot" aria-label="Publicidad">
        <ins
          class="adsbygoogle"
          style="display: block"
          data-ad-client="ca-pub-9763480712544528"
          data-ad-slot="8831048337"
          data-ad-format="auto"
          data-full-width-responsive="true"
        ></ins>
      </div>
    </div>
    <div id="menu-ui" aria-label="Niveles guardados">
      <div id="menu-list"></div>
      <div id="menu-empty" style="display: none">Sin niveles guardados — creá uno.</div>
      <button type="button" id="menu-new" class="primary">Nuevo nivel</button>
    </div>
    <nav id="editor-ui" aria-label="Editor de niveles">
      <div class="row">
        <input type="text" id="ed-name" maxlength="60" placeholder="Nombre del nivel" aria-label="Nombre del nivel" />
        <select id="ed-open" aria-label="Abrir nivel guardado"></select>
        <button type="button" id="ed-new">Nuevo</button>
        <button type="button" id="ed-delete">Borrar</button>
      </div>
      <div class="row" id="ed-tools">
        <button type="button" data-tool="ground">Piso</button>
        <button type="button" id="ed-tile-btn" title="Variante de piso"></button>
        <div id="ed-tile-grid" hidden></div>
        <button type="button" data-tool="erase">Borrar</button>
        <button type="button" data-tool="player_start">Inicio</button>
        <select id="ed-player" aria-label="Personaje">
          <option value="pink">Pink Man</option>
        </select>
        <button type="button" data-tool="enemy">Enemigo</button>
        <select id="ed-enemy" aria-label="Tipo de enemigo">
          <option value="walker">Caminante</option>
          <option value="flyer">Volador</option>
        </select>
        <button type="button" data-tool="item">Item</button>
        <button type="button" data-tool="spikes">Obstáculo</button>
        <select id="ed-obstacle" aria-label="Tipo de obstáculo">
          <option value="spikes">Pinchos</option>
          <option value="saw">Sierra</option>
          <option value="fire">Fuego</option>
        </select>
        <button type="button" data-tool="exit">Salida</button>
      </div>
      <div class="row">
        <button type="button" id="ed-validate">Validar</button>
        <button type="button" id="ed-save">Guardar</button>
        <button type="button" id="ed-export">Exportar</button>
        <button type="button" id="ed-import">Importar</button>
        <button type="button" id="ed-test">Probar</button>
        <button type="button" id="ed-exit">Menú</button>
        <span id="ed-status"></span>
      </div>
    </nav>
    <button type="button" id="game-back">← Editor</button>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', function () {
        try {
          (window.adsbygoogle = window.adsbygoogle || []).push({});
        } catch (e) {}
      });
    </script>
  </body>
</html>
