# TinoGames local: solo Postgres + API. En el VPS, Caddy-docker-proxy
# descubre el server por labels (ver bloque comentado).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tinogames
      POSTGRES_PASSWORD: tinogames
      POSTGRES_DB: tinogames
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tinogames']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://tinogames:tinogames@db:5432/tinogames
    ports:
      - '8080:8080'
    # VPS (caddy-docker-proxy): descomentar y setear el dominio.
    # labels:
    #   caddy: api.tino.example.com
    #   caddy.reverse_proxy: '{{upstreams 8080}}'
    # networks:
    #   - proxy

volumes:
  pgdata:

